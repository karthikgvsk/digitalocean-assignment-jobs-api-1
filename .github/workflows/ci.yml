name: CI/CD - DigitalOcean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Unit tests
        run: pytest tests/test_unit.py
      - name: Integration tests (PostgreSQL + Redis)
        run: pytest tests/test_api.py tests/test_integration.py
        env:
          DATABASE_URL: postgresql+psycopg://jobs:jobs@localhost:5432/jobs
          REDIS_URL: redis://localhost:6379/0
      - run: docker build -t jobs-api:${{ github.sha }} .

  # Add a deployment job only after the interview's DigitalOcean project,
  # registry, and App Platform app are confirmed. Store credentials in Actions secrets.
